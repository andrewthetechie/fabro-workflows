[project]
name = "fabro-gate-tests"
version = "0.1.0"
description = "Offline tests for the shell embedded in the Fabro graphs' command nodes."
# 3.11, the interpreter `make check` already requires (ops/check.sh).
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
# Each test is one section of checks; a section's own failures are listed by name in
# its report, so the traceback adds nothing.
addopts = "-p no:cacheprovider --tb=line"
