version = 1
filing = true

[[ratchet]]
tool = "ruff"
rule = "B006"
command = "uv run ruff check --select B006 --output-format json src tests"
enforce_in = "pyproject.toml"
enforce_how = "add \"B006\" to `extend-select` under `[tool.ruff.lint]`"
timeout_secs = 900

[flaky]
min_flakes = 4
window_days = 7
ignore_jobs = ["alls-green"]
