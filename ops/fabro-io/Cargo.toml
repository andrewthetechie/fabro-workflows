[package]
name = "fabro-io"
version = "0.1.0"
edition = "2024"
description = "Stage I/O MCP server (ADR 0016): reads a stage's inputs and writes its output contract with an Input receipt"
license = "MIT"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = { version = "0.3", features = ["std"] }
rmcp = { version = "=1.7.0", features = ["server", "transport-streamable-http-server"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
lto = true
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3
