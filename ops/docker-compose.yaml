services:
  fabro:
    image: ghcr.io/fabro-sh/fabro:${FABRO_VERSION:-nightly}
    restart: unless-stopped
    ports:
      - "${FABRO_PORT:-32276}:32276"
    volumes:
      - fabro-storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /workspace  # host hook cwd (source_directory); must exist for sandbox=false hooks
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:32276/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The coder scheduler (ops/scheduler/, deployed to ./scheduler beside this
  # file). It owns admission to the coder instances; fabro keeps owning
  # everything inside a run. It shares this project so `docker compose ps` shows
  # the whole factory in one place, and so a host rebuild brings it back with
  # everything else.
  scheduler:
    image: fabro-scheduler:local
    build:
      context: ./scheduler
    container_name: fabro-scheduler
    restart: unless-stopped
    ports:
      # One variable on both sides: compose publishes ${SCHEDULER_PORT} on the
      # host and the same value reaches the container as the port it binds.
      # Splitting the two is how you get a mapping that points at a closed port.
      - "${SCHEDULER_PORT:-32280}:${SCHEDULER_PORT:-32280}"
    volumes:
      - scheduler-data:/data  # SQLite, from draft 06 onward; mounted now so compose never changes again
    environment:
      # Resolved here rather than only read from env_file, so the container cannot
      # bind one port while compose publishes another when the value is set in the
      # shell instead of ~/fabro/.env.
      SCHEDULER_PORT: "${SCHEDULER_PORT:-32280}"
      # ralph's share (ADR 0029 O2, O21, O24): 0, 50 or 100. 50 from the trial's
      # switch on 2026-10-22 (docs/ralph/12); 100 since the trial's result on
      # 2026-11-02: every non-fast-path issue goes to `ralph`, and `fast-path` issues
      # stay on `backlog`'s fast lane. 50 is the trial's parity split. The kill switch is 0: here and
      # `make deploy-compose deploy-scheduler`, or `SCHEDULER_RALPH_SHARE=0` in
      # ~/fabro/.env and `docker compose up -d --no-deps scheduler` on the host.
      # Either recreates only the scheduler; in-flight `ralph` runs finish.
      SCHEDULER_RALPH_SHARE: "${SCHEDULER_RALPH_SHARE:-100}"
      # z.ai's peak hours (ops/scheduler/src/fabro_scheduler/peak.py): weekdays
      # 14:00-18:00 Singapore time, which has no DST, so 06:00-10:00 UTC. Usage
      # off-peak costs 50% of the peak credit rate (docs.z.ai/devpack/overview, read
      # 2026-10-28). The scheduler starts no run from LEAD minutes before a window
      # until it closes; the page's override button lifts that. If z.ai moves the
      # window, change it here ('<days> <HH:MM>-<HH:MM> <+HH:MM>', several joined by
      # ';', 'off' to disable) and recreate the scheduler only, as for the share.
      SCHEDULER_PEAK_HOURS: "${SCHEDULER_PEAK_HOURS:-mon-fri 14:00-18:00 +08:00}"
      SCHEDULER_PEAK_LEAD_MINUTES: "${SCHEDULER_PEAK_LEAD_MINUTES:-15}"
      # The background lane (more-local-inference C7, D12). One switch, `on` or `off`,
      # and **off by default here as well as in config.py**: the operator turns it on
      # in ~/fabro/.env. Off means no new background run starts; running ones finish.
      # The scheduler reads its environment from these lines and ~/fabro/scheduler.env
      # only — it never reads .env as an env file — so a variable missing here is a
      # variable the container never sees.
      SCHEDULER_BACKGROUND: "${SCHEDULER_BACKGROUND:-off}"
      # How long strix-infer must report a box idle before a background run may start.
      SCHEDULER_BG_GAP_S: "${SCHEDULER_BG_GAP_S:-30}"
      # Run slots fabro must have free, counting `pending`, before a background run
      # starts (D8). Fabro's own cap is `server.scheduler.max_concurrent_runs`.
      SCHEDULER_BG_SLOT_RESERVE: "${SCHEDULER_BG_SLOT_RESERVE:-3}"
      # The boxes' strix-infer `/health` endpoints, in the same `pool=url` format
      # `fabro-io box-claim` reads. Empty means no box is in the lane.
      SCHEDULER_BOX_HEALTH: "${SCHEDULER_BOX_HEALTH:-coders-a=http://10.10.0.29:5300/health,coders-b=http://10.10.0.56:5300/health}"
      # Keep equal to fabro's `server.scheduler.max_concurrent_runs`: the scheduler reads
      # it only to count free slots, and a larger value would hand out slots that do not
      # exist.
      SCHEDULER_MAX_CONCURRENT_RUNS: "${SCHEDULER_MAX_CONCURRENT_RUNS:-8}"
      # Which job kinds' PRODUCERS run, comma-separated. It gates producers only, never the
      # lane's pick, so a job queued by hand through `POST /api/background/box-noop` still
      # runs with `box-noop` absent here. `issue-precheck` (more-local-inference 07, shadow mode:
      # it posts a verdict and holds nothing) is the first real producer; `context-pack` (08)
      # maps the issues the precheck passed, for `decompose` and `plan`. An unknown kind (the
      # removed `pr-doctor` among them) fails startup. **`precheck-calibration` and
      # `flaky-investigation` are deliberately absent**: the operator turns each on here (or in
      # ~/fabro/.env) once the deploy that ships it is in place. An empty value reads as unset
      # here (`:-`), and config.py's own default is every live kind.
      SCHEDULER_BG_KINDS: "${SCHEDULER_BG_KINDS:-box-noop,issue-precheck,context-pack}"
      # The precheck calibration's producer (pre-review-and-calibration, Part A): how many
      # `precheck-calibration` jobs it keeps queued, and how far back it looks for finished
      # runs (an ISO date, compared as a string prefix against `dispatched_at`).
      SCHEDULER_CALIBRATION_QUEUED: "${SCHEDULER_CALIBRATION_QUEUED:-4}"
      SCHEDULER_CALIBRATION_SINCE: "${SCHEDULER_CALIBRATION_SINCE:-2026-09-25}"
      # How many of the next issues of each repository, in dispatch order, the precheck
      # producer keeps checked and the context-pack producer keeps mapped.
      SCHEDULER_PRECHECK_PER_REPO: "${SCHEDULER_PRECHECK_PER_REPO:-3}"
      # The precheck's HOLDS (more-local-inference D20). **Off by default here and in
      # config.py**: the precheck has run in shadow mode since 2026-10-30, and a hold is turned
      # on per verdict only once `GET :32280/api/background/calibration` shows that verdict is
      # right (ops/README.md has the rule). Off means no new hold is applied; an issue that
      # already carries a `precheck-*` label stays out of the queue either way.
      SCHEDULER_PRECHECK_HOLDS: "${SCHEDULER_PRECHECK_HOLDS:-off}"
      # Which verdicts hold an issue. `unverifiable` is accepted and not in the default. `ready`
      # is refused: it is the absence of a hold, and naming it would take the whole queue out.
      SCHEDULER_PRECHECK_HOLD_VERDICTS: "${SCHEDULER_PRECHECK_HOLD_VERDICTS:-already_done,contradiction,unclear,blocked}"
      # The first `dispatched_at` whose pre-review arm is a measurement (Phase 4,
      # `/api/background/measure`): before it the arm was the ralph trial's bit. Set it in
      # ~/fabro/.env to the push that shipped the bit-2 arm; without this line that setting
      # never reaches the container.
      SCHEDULER_PRE_REVIEW_ARM_SINCE: "${SCHEDULER_PRE_REVIEW_ARM_SINCE:-2026-11-01T00:00:00+00:00}"
    # Deliberately **not** `env_file: .env`. That file carries fabro's
    # SESSION_SECRET — a cookie-signing key this service has no use for — and the
    # scheduler's credentials are its own two: GITHUB_TOKEN today, FABRO_API_TOKEN
    # from draft 07. `required: false` because one service or the other has to
    # come up first on a fresh host; a missing file leaves the scheduler serving a
    # page that names the variable, not crash-looping.
    env_file:
      - path: scheduler.env
        required: false
    healthcheck:
      # urllib, not curl: the runtime image is python:slim and deliberately has no
      # HTTP client installed. urlopen raises on a non-2xx, so a traceback and a
      # non-zero exit is the failure path.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SCHEDULER_PORT:-32280}/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  fabro-storage:
  scheduler-data:
