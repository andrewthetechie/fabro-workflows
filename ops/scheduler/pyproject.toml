[project]
name = "fabro-scheduler"
version = "0.1.0"
description = "Owns admission to the coder instances: it inventories work, orders it, and creates one fabro run at a time."
# 3.11 for `tomllib` in the stdlib. Pinned to what `python3.11` on the Mac and
# `python:3.11-slim-bookworm` in the image both provide, so `uv run pytest` and
# the container run the same interpreter.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
fabro-scheduler = "fabro_scheduler.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabro_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
