<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2b3038;
    --fg: #e6e9ee; --dim: #98a1ae; --accent: #8ab4f8;
    --warn: #f2c14e; --bad: #ff6b6b; --ok: #5ec98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem;
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
  h2 { font-size: .95rem; margin: 1.75rem 0 .5rem; color: var(--dim); font-weight: 600; }
  .sub { color: var(--dim); margin: 0 0 1rem; max-width: 90ch; }
  .sub code { color: var(--fg); }
  .banner {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--warn); border-radius: 4px;
    padding: .6rem .8rem; margin: 0 0 1rem;
  }
  .banner.bad { border-left-color: var(--bad); }
  .banner.ok { border-left-color: var(--ok); }
  .banner p { margin: .2rem 0; }
  #note {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--bad); border-radius: 4px;
    padding: .6rem .8rem; margin: 0 0 1rem; color: var(--bad);
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.rank { color: var(--dim); }
  td.title { max-width: 50ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.starved td.title::before { content: "\2605 "; color: var(--warn); }
  tr.overridden td.title::before { content: "\21E1 "; color: var(--accent); }
  .label { color: var(--dim); font-size: .85em; }
  .stale { color: var(--warn); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  .muted { color: var(--dim); }
  .controls { white-space: nowrap; }
  form.control { display: inline; }
  button {
    font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px;
    padding: .15rem .5rem; margin-right: .3rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { color: var(--dim); border-color: var(--line); cursor: not-allowed; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  nav { margin: 0 0 1rem; color: var(--dim); font-size: .9em; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav strong { color: var(--fg); font-weight: 600; }
  nav .sep { margin: 0 .5rem; }
  th a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
  th a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  footer { color: var(--dim); margin-top: 2rem; font-size: .85em; }
</style>
