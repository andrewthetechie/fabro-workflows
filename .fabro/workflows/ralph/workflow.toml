# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
# Read by pr_handoff for the per-repo auto-merge switch, and by the imported
# review-merge phase for the host-wide one.
FABRO_API_URL    = "{{ vars.FABRO_API_URL }}"
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"
# FlakeRadar's base URL (ADR 0028 F1): watch_checks asks it whether a red check fails only on
# known flaky tests. Empty means today's path.
FLAKERADAR_URL   = "{{ vars.FLAKERADAR_URL }}"

# Hooks (docs/ralph C1). ralph imports nothing, so every node id is bare and every matcher
# is anchored `^node$`; the `(^|[.])node$` form in backlog's file is for imported phases.
#
# io-stage (ADR 0016): writes stage.json with a fresh visit at the start of every agent
# stage. Every receipt check in this graph (plan_gate, record, refute_gate, review_gate,
# resolve_merge_gate, resolve_base_gate, learn_post) compares against that visit, so
# without this hook every agent stage reads as a miss. blocking = true, sandbox = true:
# fabro-io lives in the profile image, and a missing binary must stop the stage.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# git-guard (docs/coder-tweaks 05): blocks mutating git from an agent's `shell` outside the
# stages the manifest marks `"git": "write"` (resolve_merge, resolve_base). Every exit code
# but 2 becomes 0, so an image without fabro-io does not fail every shell call. backlog's
# file has the full reasoning.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# io-guard (C10): the Refuter and both reviewers may not read the Iteration's own record
# (progress.md, tasks.json, ...) or each other's output; the manifest lists each stage's
# sealed paths. It guards against mistakes and must not stop the stage.
[[run.hooks]]
id = "io-guard"
event = "pre_tool_use"
matcher = "^(refute|standards|spec)$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io guard"

# Discord. sandbox = false runs the script in the server container, where the webhook URL
# lives; blocking = false so a Discord outage cannot stall a run. `checkpoint_saved`, not
# `stage_complete`: the node's context writes (`pr_url`, `review_merge_outcome`) are in the
# checkpoint by the time the hook runs. backlog's file has the history of each choice.
[[run.hooks]]
id = "discord-complete"
event = "checkpoint_saved"
matcher = "^open_pr$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh complete"

# The unexpected path: the run itself failed.
[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"

# A Contradiction returned the issue to triage: the same message issue triage sends for a
# question, because the human answers it the same way. The routing gate before
# return_to_triage publishes `triage_questions`, which this stage_start hook reads; the node
# itself has not run yet when it fires.
[[run.hooks]]
id = "discord-triage-question"
event = "stage_start"
matcher = "^return_to_triage$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-question"

# The four ends of the merge stage (C8). Each asks the operator for something different.
[[run.hooks]]
id = "discord-merged"
event = "checkpoint_saved"
matcher = "^report_merged$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh merged"

[[run.hooks]]
id = "discord-queued"
event = "checkpoint_saved"
matcher = "^report_queued$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh queued"

[[run.hooks]]
id = "discord-blocked"
event = "checkpoint_saved"
matcher = "^report_blocked$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh blocked"

# mark_needs_human is also where stop_reason sends a `post` failure, so this is the notice
# for every run that ends after the PR opened without a verdict.
[[run.hooks]]
id = "discord-needs-human"
event = "checkpoint_saved"
matcher = "^mark_needs_human$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh needs-human"
