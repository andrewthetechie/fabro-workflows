# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage; matcher ^agent$ fires on the agent handler type, so it covers
# every agent node including the imported triage phase. blocking = true,
# sandbox = true: the binary lives in the profile image, and a missing or too-old
# binary must stop the stage. A retry starts a new visit (task 02 spike6b).
# docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# git-guard (docs/coder-tweaks 05, C2): blocks mutating git (`stash`, `checkout --`, `commit`,
# `fetch`, ...) from an agent's `shell` outside the stages the manifest marks `"git": "write"`
# (resolve_merge, rebase_agent_t1/t2); the reason names `restore_file` / `baseline_check`.
# matcher ^shell$ is tested against tool_name. blocking = true, sandbox = true. ANY non-zero
# exit but 2 also blocks (fabro's parse_decision), so a `fabro-io` missing from an old image
# (exit 127) would fail every shell call: the wrapper turns every code but 2 into 0. It is a
# guard against mistakes, not a boundary: `sh -c` and `python` bypass it.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

[[run.hooks]]
id = "discord-arch-summary"
event = "stage_start"
matcher = "^finish$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh arch-summary"

[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"

# The triage phase is imported as `triage_phase`, so its node ids are prefixed
# (`triage_phase.post_questions`). A bare `^post_questions$` matches nothing.
# One message per issue that needs a human, with the issue link (ADR 0012 D3).
[[run.hooks]]
id = "discord-triage-question"
event = "stage_start"
matcher = "(^|[.])post_questions$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-question"

[[run.hooks]]
id = "discord-triage-failed"
event = "stage_start"
matcher = "(^|[.])release$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-failed"
