_version = 1

[workflow]
graph = "workflow.fabro"

# high-reasoning is a role alias on zai:glm-5.3 (ADR 0003). When z.ai is rate-limited
# or errors, the stage falls back to Kimi's kimi-k3. No stage uses a coder box, so the
# coder scheduler does not admit this workflow (ADR 0012 D7).
[run.model.fallbacks]
high-reasoning = ["kimi:kimi-k3"]

# The review reads code and writes issues. It never writes code.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# Nothing in this package commits. No run branch and no checkpoint commits (0.362: enabled = false also skips checkpoint commits).
[run.run_branch]
enabled = false

# Discord. Hooks run with sandbox = false, inside the fabro server container, and read
# the webhook URL from /storage/secrets/discord_webhook_url. `finish` runs after
# `summarize` has published `arch_summary`, so the hook can read it.
# fabro-io (ADR 0016): one streamable-HTTP MCP server per agent stage, in the
# profile-image sandbox (type = sandbox -> the image runs the static binary). The
# server lists no tools until a stage is live, so until tasks 07-10 this only adds
# a server start (~0.3 s, spike check 2) and one stage hook to every agent stage.
# docs/stage-io/.
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
tool_timeout = "30s"

[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"min_binary":"0.1.0","stages":{"scan":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the files changed most often in the last 90 days, as 'count path' lines, most changed first","name":"hotspots.txt","path":"/tmp/fabro/arch/hotspots.txt","required":true},{"about":"the architecture issues that already exist, open and closed, as [{number, title, state, stateReason, slug}]","name":"existing.json","path":"/tmp/fabro/arch/existing.json","required":true}]},"triage_phase.improve":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the single issue, with .body as the report, .title the current title, .comments the human discussion, .labels what the repository already believes","name":"issue.json","path":"/tmp/fabro/issue.json","required":true}]},"triage_phase.triage":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the single issue refreshed after improve, with .title, .comments and .labels","name":"issue.json","path":"/tmp/fabro/issue.json","required":true}]}},"version":1}'''
# END fabro-io manifest
# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage; matcher ^agent$ fires on the agent handler type, so it covers
# every agent node including the imported triage phase. blocking = true,
# sandbox = true: the binary lives in the profile image, and a missing or too-old
# binary must stop the stage. A retry starts a new visit (task 02 spike6b).
# docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

[[run.hooks]]
id = "discord-arch-summary"
event = "stage_start"
matcher = "^finish$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh arch-summary"

[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"

# The triage phase is imported as `triage_phase`, so its node ids are prefixed
# (`triage_phase.post_questions`). A bare `^post_questions$` matches nothing.
# One message per issue that needs a human, with the issue link (ADR 0012 D3).
[[run.hooks]]
id = "discord-triage-question"
event = "stage_start"
matcher = "(^|[.])post_questions$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-question"

[[run.hooks]]
id = "discord-triage-failed"
event = "stage_start"
matcher = "(^|[.])release$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-failed"
