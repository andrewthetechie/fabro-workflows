_version = 1

[workflow]
graph = "workflow.fabro"

# Nothing in this package commits, and nothing in a background package may write to GitHub
# before its last node (more-local-inference D9, R16). No run branch and no checkpoint
# commits (0.362: enabled = false also skips checkpoint commits). Left to the default, or to
# the target repository's .fabro/project.toml, a run branch pushes a checkpoint after every
# stage, and a branch push can start CI on the self-hosted runners.
[run.run_branch]
enabled = false

# `claim` reads the issue, its comments and the issue's edit history, and `post` writes one
# comment; nothing here touches code or a pull request. `contents = read` is what the sandbox
# clone needs, and the FlakeRadar reads are plain HTTP to `FLAKERADAR_URL`, which needs no
# token (docs/flakeradar, the Facts).
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# A background package (more-local-inference D4, R16): every agent stage's model is
# `{{ inputs.coder_pool }}`, which the scheduler sets to `coders-a-bg` or `coders-b-bg`, so a
# diagnosis spends no hosted credits (C5). It binds no `[run.inputs]`: `coder_pool` and
# `issue_number` are per-run, and a bound `coder_pool` would pin every hand-fired run to one
# box. There is no `[run.model.fallbacks]` at all: a `-bg` name must not fall back anywhere
# (C5, R14).

# fabro-io (ADR 0016): the MCP server every agent stage carries, and the `io-stage` hook
# below. Without them a stage has no visit, and `gate`'s receipt check reads every check as a
# miss (R11).
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s (docs/coder-tweaks 04): `baseline_check` may run a command for up to 600s.
tool_timeout = "660s"

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to
# cancel this run, and the `/health` URL of this run's box. Written exactly as `box-noop`'s
# are. An unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables
# must exist before this package is used; `ops/provision-server-state.sh` creates them.
[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"coder_box_stages":{"backlog":{"coder":true,"extra_decompose":true,"plan":"plan-arm","pre_review":true,"resolve_merge":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true,"rework_t1":true},"pr-review":{"rebase_agent_t1":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true},"ralph":{"iterate_t1":true,"learn":true,"plan":"plan-arm","pre_review":true,"resolve_base":true}},"min_binary":"0.9.0","stages":{"investigate":{"box":true,"inputs":[{"about":"the issue the scout filed: its title, labels, body, its last ten comments that are not fabro markers, and the scout fingerprint that names the test or job","name":"issue.md","path":"/tmp/fabro/flaky/issue.md","required":true},{"about":"what FlakeRadar holds for this test or job: its score, tier, proven flakes, failure category, and the recent failures with their messages and newest traceback, or for a job each run's outcome and which test explained it","absent":"FlakeRadar has no readable record of this failure; diagnose from the issue and the code alone, and say so","name":"flakeradar.md","path":"/tmp/fabro/flaky/flakeradar.md","required":false}],"output":{"path":"/tmp/fabro/flaky.json","schema":{"$id":"flaky_investigation","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"What a local model concluded about one flaky test or CI job, from FlakeRadar's records and the code at main: the likely cause, the evidence, and the fix it proposes. It never reproduced the failure. `gate` checks the Input receipt, requires every cited file:line to exist in the checkout, and cuts the rendered comment at a whole line to fit the 2,500 characters C9 gives this kind in background.md. `post` publishes it as the issue's flaky-investigation marker comment, which backlog's and ralph's `claim` copy into background.md for the run that takes the issue. _io is stamped by the server and is not part of this schema.","properties":{"cause":{"description":"The one class the evidence points at. `timing`: a sleep, a timeout, a race on the clock. `ordering`: the test depends on the order it runs in, or on another test having run. `shared-state`: a module-level, cached or database fixture two tests share. `resource`: a port, a lock, a file or a browser instance the test does not release. `network`: something outside the runner answered slowly or not at all. `environment`: a runner, image, OS or toolchain difference. `test-data`: a fixture, seed or generated value. `other` when the evidence does not single one out, and say so in `summary`.","enum":["timing","ordering","shared-state","resource","network","environment","test-data","other"],"type":"string"},"confidence":{"description":"`high` only when a file:line in the checkout shows the mechanism. `low` when the evidence is FlakeRadar's failure texts alone.","enum":["low","medium","high"],"type":"string"},"evidence":{"description":"What the conclusion rests on. `where` is path:line in the checkout, or the literal `flakeradar` for a fact from FlakeRadar's record, or `issue` for what the issue body says.","items":{"additionalProperties":false,"properties":{"says":{"maxLength":300,"minLength":1,"type":"string"},"where":{"maxLength":200,"minLength":1,"type":"string"}},"required":["where","says"],"type":"object"},"maxItems":6,"minItems":1,"type":"array"},"fix":{"description":"The change you would make, as a proposal only: this run edits nothing and posts no branch. `where` is path:line, or `test` when the change is the test's own setup.","items":{"additionalProperties":false,"properties":{"change":{"maxLength":300,"minLength":1,"type":"string"},"where":{"maxLength":200,"minLength":1,"type":"string"}},"required":["where","change"],"type":"object"},"maxItems":3,"minItems":1,"type":"array"},"reproduced":{"const":false,"description":"Always false: this run does not run the test. It reads FlakeRadar's records and the code. The field is here so nothing downstream can mistake the diagnosis for a reproduction."},"summary":{"description":"One to three plain sentences a human can act on: what the evidence shows and what you would change. Published verbatim on the issue.","maxLength":700,"minLength":1,"type":"string"}},"required":["cause","summary","evidence","fix","confidence","reproduced"],"title":"flaky_investigation \u2014 a box diagnosis of one queued flaky-test issue (more-local-inference 10)","type":"object"}}}},"version":1}'''
# END fabro-io manifest
# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
# FlakeRadar's base URL (ADR 0028 F1). An empty value means "no FlakeRadar": `claim` then
# writes no `flakeradar.md`, and the diagnosis rests on the issue and the code alone. The GET
# endpoints this package reads need no token, so `FLAKERADAR_API_TOKEN` is deliberately absent:
# nothing here writes a link back.
FLAKERADAR_URL = "{{ vars.FLAKERADAR_URL }}"

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to cancel
# this run, and the `/health` URL of this run's box. Without them the guard logs one line and
# lets the stage run, so the third layer of D17 is silently absent (R16 checks for them). An
# unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables must exist
# before this package is used; `ops/provision-server-state.sh` creates them.
FABRO_API_URL   = "{{ vars.FABRO_API_URL }}"
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
FABRO_BOX_HEALTH = "{{ vars.FABRO_BOX_HEALTH }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of every
# agent stage. blocking = true, sandbox = true. docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# The marker comment carries `run=<run_id>` (C6), and a command node cannot see the run id:
# `FABRO_RUN_ID` and the hook context are set for hooks only (invariants-graph, *Agents and
# hooks*). A `stage_start` hook can, so this one writes it to a file for `post`, which is a
# command node. It is non-blocking and always exits 0: a hook that cannot write the file
# costs the marker's `run=` field and nothing else, and `post` reads an absent file as
# `run=unknown`.
[[run.hooks]]
id = "flaky-run-id"
event = "stage_start"
matcher = "^agent$"
blocking = false
sandbox = true
timeout = "10s"
script = "mkdir -p /tmp/fabro/flaky; printf '%s' \"$FABRO_RUN_ID\" > /tmp/fabro/flaky/run_id 2>/dev/null || true; exit 0"

# git-guard (docs/coder-tweaks C2): blocks mutating git from an agent's `shell`. Required by
# R11 wherever the `io` server is declared. Any exit but 2 blocks, so the wrapper turns a
# missing binary (exit 127) into 0. The diagnosis reads the checkout and commits nothing.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# box-guard (more-local-inference C10, D17 layer 3): before each agent stage, look at the
# box's coder loop. If it is in a box stage, or strix-infer is busy, cancel this run's own
# run and let the stage die with it. The job is queued again and starts later: a cancel before
# `post` leaves nothing on GitHub (D9).
[[run.hooks]]
id = "box-guard"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "30s"
script = "fabro-io box-guard; [ $? -eq 2 ] && exit 2; exit 0"
