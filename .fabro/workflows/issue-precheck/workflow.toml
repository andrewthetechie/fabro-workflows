# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
FABRO_API_URL = "{{ vars.FABRO_API_URL }}"
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
FABRO_BOX_HEALTH = "{{ vars.FABRO_BOX_HEALTH }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of every
# agent stage. blocking = true, sandbox = true. docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# The marker comment carries `run=<run_id>` (C6), and a command node cannot see the run id:
# `FABRO_RUN_ID` and the hook context are set for hooks only (invariants-graph, *Agents and
# hooks*). A `stage_start` hook can, so this one writes it to a file for `post`, which is a
# command node. It is non-blocking and always exits 0: a hook that cannot write the file
# costs the marker's `run=` field and nothing else, and `post` reads an absent file as
# `run=unknown`.
[[run.hooks]]
id = "precheck-run-id"
event = "stage_start"
matcher = "^agent$"
blocking = false
sandbox = true
timeout = "10s"
script = "mkdir -p /tmp/fabro/precheck; printf '%s' \"$FABRO_RUN_ID\" > /tmp/fabro/precheck/run_id 2>/dev/null || true; exit 0"

# git-guard (docs/coder-tweaks C2): blocks mutating git from an agent's `shell`. Required by
# R11 wherever the `io` server is declared. Any exit but 2 blocks, so the wrapper turns a
# missing binary (exit 127) into 0. The check edits nothing and commits nothing.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# box-guard (more-local-inference C10, D17 layer 3): before each agent stage, look at the
# box's coder loop. If it is in a box stage, or strix-infer is busy, cancel this run's own
# run and let the stage die with it. The job is queued again and starts later: a cancel before
# `post` leaves nothing on GitHub (D9).
[[run.hooks]]
id = "box-guard"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "30s"
script = "fabro-io box-guard; [ $? -eq 2 ] && exit 2; exit 0"
