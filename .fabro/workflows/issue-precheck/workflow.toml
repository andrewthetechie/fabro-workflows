_version = 1

[workflow]
graph = "workflow.fabro"

# Nothing in this package commits, and nothing in a background package may write to GitHub
# before its last node (more-local-inference D9, R16). No run branch and no checkpoint
# commits (0.362: enabled = false also skips checkpoint commits). Left to the default, or to
# the target repository's .fabro/project.toml, a run branch pushes a checkpoint after every
# stage, and a branch push can start CI on the self-hosted runners.
[run.run_branch]
enabled = false

# `claim` reads the issue, its comments and the open issues; `post` writes one comment.
# issues = write is the Issues permission in GitHub's model; nothing here touches code or a
# pull request.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# A background package (more-local-inference D4, R16): every agent stage's model is
# `{{ inputs.coder_pool }}`, which the scheduler sets to `coders-a-bg` or `coders-b-bg`, so a
# precheck spends no hosted credits (C5). It binds no `[run.inputs]`: `coder_pool` and
# `issue_number` are per-run, and a bound `coder_pool` would pin every hand-fired run to one
# box. There is no `[run.model.fallbacks]` at all: a `-bg` name must not fall back anywhere
# (C5, R14).

# fabro-io (ADR 0016): the MCP server every agent stage carries, and the `io-stage` hook
# below. Without them a stage has no visit, and `gate`'s receipt check reads every check as a
# miss (R11).
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s (docs/coder-tweaks 04): `baseline_check` may run a command for up to 600s.
tool_timeout = "660s"

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to
# cancel this run, and the `/health` URL of this run's box. Written exactly as `box-noop`'s
# are. An unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables
# must exist before this package is used; `ops/provision-server-state.sh` creates them.
[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"coder_box_stages":{"backlog":{"coder":true,"extra_decompose":true,"plan":"plan-arm","resolve_merge":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true,"rework_t1":true},"pr-review":{"rebase_agent_t1":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true},"ralph":{"iterate_t1":true,"learn":true,"plan":"plan-arm","resolve_base":true}},"min_binary":"0.9.0","stages":{"check":{"box":true,"inputs":[{"about":"the issue: its title, labels, body, and its last ten comments that are not fabro markers","name":"issue.md","path":"/tmp/fabro/precheck/issue.md","required":true},{"about":"the repository's other open issues, one per line as `#N title`; a `blocked` verdict's blocker must be one of them","name":"open_issues.md","path":"/tmp/fabro/precheck/open_issues.md","required":true}],"output":{"path":"/tmp/fabro/precheck.json","schema":{"$id":"precheck","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"A local model's check of one queued issue before the factory spends hosted credits on it. `gate` checks the Input receipt and applies two rules of its own: a verdict other than ready with no evidence counts as ready, and a blocked verdict whose blocker is not an open issue in the same repository counts as ready. `post` publishes the result as the issue's precheck marker comment. _io is stamped by the server and is not part of this schema.","if":{"properties":{"verdict":{"const":"blocked"}},"required":["verdict"]},"properties":{"blocker":{"description":"Only for blocked: the open issue in this repository that must be done first.","minimum":1,"type":"integer"},"evidence":{"description":"What the verdict rests on, one entry each. Must name where: a file and line for already_done, the blocking issue for blocked, the criterion and the non-goal for contradiction. May be empty only for ready.","items":{"additionalProperties":false,"properties":{"says":{"description":"What is there, 