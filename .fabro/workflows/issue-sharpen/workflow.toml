_version = 1

# issue-sharpen (issue-sharpening, ADR 0033): a leased run that rewrites one `unverifiable`
# issue's acceptance criteria so the Refuter can mark each one, with no human approval. It is
# not a background run. The scheduler leases it a coder pool the way an issue run is leased
# one (`target_kind = 'sharpen'`), so it carries `box-claim`, like `ralph`, and no `box-guard`:
# a leased run holds its box, and a guard would cancel the run that owns it. Every agent stage
# runs on the lease's box through its `-bg` model row (`model_pool`), with no hosted model and
# no fallback (D1, R17).

[workflow]
graph = "workflow.fabro"

# Nothing in this package pushes: `apply` and `post` write the issue body and two comments
# through `gh`. No run branch and no checkpoint commits (0.362: enabled = false also skips
# checkpoint commits), because a branch push can start CI on the self-hosted runners.
[run.run_branch]
enabled = false

# `claim` reads the issue and its comments; `apply` edits the body and `post` writes
# comments. issues = write is the Issues permission in GitHub's model; nothing here touches
# code or a pull request.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# It binds no `[run.inputs]`: `issue_number`, `coder_pool` and `model_pool` are per-run, and a
# bound `coder_pool` would pin every hand-fired run to one box. There is no
# `[run.model.fallbacks]` at all: a `-bg` name must not fall back anywhere (R14, R17).

# fabro-io (ADR 0016): the MCP server every agent stage carries, and the `io-stage` hook
# below. Without them a stage has no visit, and `gate`'s receipt check reads every check as a
# miss (R11).
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s (docs/coder-tweaks 04): `baseline_check` may run a command for up to 600s.
tool_timeout = "660s"

# Read by the `box-claim` hook: the API to list the box's runs, the token to cancel a sibling
# slot's background run, and the `/health` URL of this run's box. An unset `{{ vars.X }}` fails
# the RunIntent at compile time, so the server variables must exist before this package is
# used; `ops/provision-server-state.sh` creates them.
[run.environment.env]
