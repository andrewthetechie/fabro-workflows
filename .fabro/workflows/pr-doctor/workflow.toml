_version = 1

[workflow]
graph = "workflow.fabro"

# The run works on the PR head branch, not on fabro/run/<id>, exactly as pr-review does:
# checkpoints still commit between stages (the fixer's edits have to survive the hop from
# `fix` to `fix_gate`), and fabro never pushes the stale fabro/run/<id> branch. `publish`
# is the one node that writes to GitHub, and it pushes the PR's head ref itself.
#
# push = false, not enabled = false: a background package may not push through fabro's run
# branch (more-local-inference R16, D9). With enabled = false the checkpoints stop
# committing, and the fixer's edits would reach `publish` only as a dirty tree -- which is
# exactly what `refute_fix_gate` resets on failure and what no gate here could tell from a
# timed-out fixer's partial work. pr-review's shape is the one that keeps a commit per stage
# without a push, so it is the one copied.
[run.run_branch]
enabled = true
push = false

# Full history: `git rebase origin/<base>`, `git merge-base --is-ancestor` and the
# three-dot diff against the base all need the true merge base. A shallow clone breaks
# every one of them (pr-review/workflow.toml has the list). `prep` also unshallows as a
# belt-and-braces guard.
[run.clone]
depth = 0

# `publish` removes two labels and edits one comment, and `claim` reads the PR and its
# comments: contents = write for the push, issues = write for labels and comments (a
# repository label is the Issues permission in GitHub's model), pull_requests = write for
# `gh pr checkout` and `gh pr view`.
[run.integrations.github.permissions]
contents = "write"
issues = "write"
pull_requests = "write"

# A background package (more-local-inference D4, R16): every agent stage's model is
# `{{ inputs.coder_pool }}`, which the scheduler sets to `coders-a-bg` or `coders-b-bg`, so
# pr-doctor spends no hosted credits (C5). It binds no `[run.inputs]`: `coder_pool` and
# `pr_number` are per-run, and a bound `coder_pool` would pin every hand-fired run to one
# box. There is no `[run.model.fallbacks]` at all: a `-bg` name must not fall back anywhere
# (C5, R14). The run's one hosted spend is the follow-up `pr-review`, which is a separate
# run the scheduler leases (D14).

# fabro-io (ADR 0016): the MCP server every agent stage carries, and the `io-stage` hook
# below. Without them a stage has no visit, and `fix_gate`'s receipt check reads every fix
# turn as a miss (R11).
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s (docs/coder-tweaks 04): `baseline_check` may run a command for up to 600s.
tool_timeout = "660s"

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to
# cancel this run, and the `/health` URL of this run's box. Written exactly as `box-noop`'s
# are. An unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables
# must exist before this package is used; `ops/provision-server-state.sh` creates them.
#
# The doctor needs no FABRO_AUTO_MERGE: it never merges. The follow-up review reads its own
# switches.
[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"coder_box_stages":{"backlog":{"coder":true,"extra_decompose":true,"plan":"plan-arm","resolve_merge":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true,"rework_t1":true},"pr-review":{"rebase_agent_t1":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true},"ralph":{"iterate_t1":true,"learn":true,"plan":"plan-arm","resolve_base":true}},"min_binary":"0.9.0","stages":{"fix":{"box":true,"inputs":[{"about":"the pull request's last merge-phase report: the **Reason:** line, the unfixed findings, the Refuter verdict, the diff-hygiene samples, and the names of the GitHub checks that are not green","name":"report.md","path":"/tmp/fabro/doctor/report.md","required":true},{"about":"the report's **Reason:** line alone, which names the category of block","name":"reason.txt","path":"/tmp/fabro/doctor/reason.txt","required":true},{"about":"PR number, title, body, refs and labels","name":"pr.json","path":"/tmp/fabro/pr.json","required":true},{"about":"present only on the second attempt: the tail of the CI failure that followed the first","absent":"this is the first fix attempt; ./.fabro/setup.sh and ./.fabro/ci.sh have not run yet","name":"fix.md","path":"/tmp/fabro/doctor/ci_failure.md","required":false}],"output":{"path":"/tmp/fabro/doctor/fix.json","schema":{"$id":"pr_doctor_fix","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The doctor's one fix turn. fix_gate checks the Input receipt, then publish posts this verbatim in the marker comment so the human who takes the PR sees what was tried. `reviewable` is the doctor's own judgement of whether one more hosted review could pass: false when a remaining blocker is one only .fabro/ci.sh could prove, or one no code change can satisfy (a PR description, a label, a risk rating). _io is stamped by the server and is not part of this schema.","if":{"properties":{"reviewable":{"const":false}},"required":["reviewable"]},"properties":{"blockers":{"description":"What stops a follow-up review from passing, one entry each. Must be non-empty when reviewable is false; may be empty when it is true.","items":{"additionalProperties":false,"properties":{"kind":{"description":"command_only: only .fabro/ci.sh can prove it, and this run may not edit .fabro/*. not_code: no code change can satisfy it (a PR description, a label, a risk rating, a review conversation).","enum":["command_only","not_code"]},"text":{"minLength":1,"type":"string"}},"required":["kind","text"],"type":"object"},"type":"array"},"commands":{"description":"Every command the report named that you ran yourself, with its result. Empty when the report named none. `output` is the last lines of what it printed.","items":{"additionalProperties":false,"properties":{"command":{"minLength":1,"type":"string"},"ok":{"type":"boolean"},"output":{"type":"string"}},"required":["command","ok"],"type":"object"},"type":"array"},"reviewable":{"description":"false when a follow-up review cannot pass whatever this run does: a blocker is provable only by .fabro/ci.sh, or no code change can satisfy it. Then the run is handed off without a hosted review.","type":"boolean"},"summary":{"description":"Two or three sentences: what the report said was wrong, and what you changed. Published verbatim.","minLength":1,"type":"string"}},"required":["summary","commands","reviewable","blockers"],"then":{"properties":{"blockers":{"minItems":1}}},"title":"pr_doctor_fix \u2014 the PR doctor's fix report (more-local-inference 06)","type":"object"}}}},"version":1}'''
# END fabro-io manifest
# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
FABRO_API_URL = "{{ vars.FABRO_API_URL }}"
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
FABRO_BOX_HEALTH = "{{ vars.FABRO_BOX_HEALTH }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of every
# agent stage. blocking = true, sandbox = true. docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# The marker comment carries `run=<run_id>` (C6), and a command node cannot see the run id:
# `FABRO_RUN_ID` and the hook context are set for hooks only (invariants-graph, *Agents and
# hooks*). A `stage_start` hook can, so this one writes it to a file for `publish`, which is
# a command node. It is non-blocking and always exits 0: a hook that cannot write the file
# costs the marker's `run=` field and nothing else, and `publish` reads an absent file as
# `run=unknown`.
[[run.hooks]]
id = "doctor-run-id"
event = "stage_start"
matcher = "^agent$"
blocking = false
sandbox = true
timeout = "10s"
script = "mkdir -p /tmp/fabro/doctor; printf '%s' \"$FABRO_RUN_ID\" > /tmp/fabro/doctor/run_id 2>/dev/null || true; exit 0"

# git-guard (docs/coder-tweaks C2): blocks mutating git from an agent's `shell`. Required by
# R11 wherever the `io` server is declared. Any exit but 2 blocks, so the wrapper turns a
# missing binary (exit 127) into 0. The fixer edits files; every git write here is a command
# node's job, which is also what keeps every commit's author under this package's control.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# box-guard (more-local-inference C10, D17 layer 3): before each agent stage, look at the
# box's coder loop. If it is in a box stage, or strix-infer is busy, cancel this run's own
# run and let the stage die with it. A doctor run is queued again and starts later, which is
# the right answer for a job whose one attempt has not been recorded yet: a cancel before
# `publish` leaves nothing on GitHub (D9).
[[run.hooks]]
id = "box-guard"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "30s"
script = "fabro-io box-guard; [ $? -eq 2 ] && exit 2; exit 0"
