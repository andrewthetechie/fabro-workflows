_version = 1

[workflow]
graph = "workflow.fabro"

# Model fallbacks (ADR 0022 D14). A model that errors or is rate-limited falls through to
# the next one, as in pr-review. The stylesheet puts every class on glm-5.3-flash except
# `.merge-spec` (glm-5.3) and `.refute` (gpt-6.1-sol). Keys containing a dot MUST be quoted.
[run.model.fallbacks]
"glm-5.3-flash" = ["zai:glm-5.3"]
"glm-5.3" = ["kimi:kimi-k3"]
# The adversarial reviewer (.refute) is non-GLM, and its fallback is non-GLM too: a refute
# outage degrades to the sibling openai model, so the merge gate keeps its independence.
"gpt-6.1-sol" = ["openai:gpt-6-luna"]

# The run branch holds the checkpoints. Only open_pr, deliver, ci_fix_gate and remerge_base
# push (ADR 0011 D1), exactly as in backlog. The merge loop validates in this checkout and
# restores it before each node ends (ADR 0022 D20).
[run.run_branch]
enabled = true
push = false

# GitHub permissions for the token, with the user each one serves:
# - contents: write. The merge loop squash-merges Dependabot PRs; the patch path pushes
#   its run branch. The Dependabot branches are read, never written.
# - issues: write. The tracking issue for an alert group (`track_issue`, `after_merge`).
# - pull_requests: write. `gh pr merge`, `gh pr close`, the `@dependabot rebase` comment
#   and the patch PR (`open_pr`).
# - vulnerability_alerts: read. `inventory` lists the open alerts (task 01, S1: the token
#   reads them).
# - checks: read. The merge loop polls `gh pr checks` before it merges.
[run.integrations.github.permissions]
contents = "write"
issues = "write"
pull_requests = "write"
vulnerability_alerts = "read"
checks = "read"

# fabro-io (ADR 0016): one streamable-HTTP MCP server per agent stage, in the profile-image
# sandbox. Copied from backlog. See docs/stage-io/.
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s, as in backlog: `baseline_check` may run for up to 600s.
tool_timeout = "660s"

# `FABRO_API_TOKEN` and `FABRO_API_URL` let `prep` read the per-repository switch from this
# server's `dependabot-<repo>` automation row (ADR 0022 D17). `FABRO_AUTO_MERGE` is the host
# switch; the shared merge phase reads it. Only the names appear here (this repository is
# public). `[run.environment.env]` interpolates `{{ vars.X }}` only, never `${X}`, and gets
# no `id` key (invariants-graph, *Packages*).
[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"min_binary":"0.4.0","stages":{"patch":{"inputs":[{"about":"the alert group to patch: package, manifest, ecosystem, its alert numbers, and first_patched, the minimum version that fixes it","name":"group.json","path":"/tmp/fabro/dep/group.json","required":true},{"about":"the full Dependabot alert records for this group (vulnerable range, advisory summary, identifiers)","name":"group_alerts.json","path":"/tmp/fabro/dep/group_alerts.json","required":true},{"about":"the tracking issue this patch resolves","name":"issue.json","path":"/tmp/fabro/issue.json","required":true},{"about":"the failing validation output from your last attempt; absent on the first attempt","absent":"this is the first attempt; there is no feedback","name":"patch_feedback.md","path":"/tmp/fabro/dep/patch_feedback.md","required":false},{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false}],"output":{"path":"/tmp/fabro/dep/patch.json","schema":{"$id":"dep_patch","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The dependabot patch agent's output (ADR 0022 C7). The shape is checked here; the cross-field rules (blocked needs a blocker and no changes, patched needs changes at or above first_patched, and the diff against sync_base) are patch_gate's, as in plan.schema.json.","properties":{"blocker":{"type":"string"},"changes":{"items":{"additionalProperties":false,"properties":{"direct":{"type":"boolean"},"from":{"type":"string"},"manifest":{"minLength":1,"type":"string"},"package":{"minLength":1,"type":"string"},"parent":{"type":"string"},"to":{"minLength":1,"type":"string"}},"required":["package","from","to","manifest","direct","parent"],"type":"object"},"type":"array"},"major":{"type":"boolean"},"status":{"enum":["patched","blocked"]},"summary":{"type":"string"},"verification":{"items":{"additionalProperties":false,"properties":{"command":{"minLength":1,"type":"string"},"result":{"enum":["pass","fail","skipped"]}},"required":["command","result"],"type":"object"},"type":"array"}},"required":["status","summary","changes","verification","major","blocker"],"title":"dep_patch \u2014 the dependabot patch agent's contract (task 06)","type":"object"}}}},"version":1}'''
# END fabro-io manifest
# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
FABRO_API_URL = "{{ vars.FABRO_API_URL }}"
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"

# io-stage (ADR 0016): writes stage.json with a fresh visit at the start of every agent stage.
# matcher ^agent$ fires on the agent handler type. blocking = true, sandbox = true: a missing
# or too-old fabro-io must stop the stage.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# git-guard (docs/coder-tweaks 05, C2): blocks mutating git from an agent's `shell`. This
# package has no `"git": "write"` stage, so `patch` is not a git exception (ADR 0022 rule 3).
# The wrapper turns every exit code but 2 into 0, so a missing fabro-io cannot block a shell.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# io-guard (ADR 0016) comes with the imported Refuter in task 07: its matcher names a
# `refute` node, and check-graph-invariants R5 rejects a matcher that matches no node.

# Discord. Hooks run with sandbox = false, inside the fabro server container, and read the
# webhook URL from /storage/secrets/discord_webhook_url. The script is an absolute path.
[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"
