# END fabro-io manifest
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage; matcher ^agent$ fires on the agent handler type, so it covers
# every agent node including the imported review-merge phase. blocking = true,
# sandbox = true: the binary lives in the profile image, and a missing or too-old
# binary must stop the stage. A retry starts a new visit (task 02 spike6b).
# docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# io-guard (ADR 0016): blocks the refuter from reading Sealed paths (the other
# reviewers' outputs) via pre_tool_use. matcher (^|[.])refute$ matches the imported
# review_merge.refute node id and never a tool name. A guard against mistakes (D8):
# it must not stop the stage. docs/stage-io/.
[[run.hooks]]
id = "io-guard"
event = "pre_tool_use"
matcher = "(^|[.])refute$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io guard"

# Discord notification on a merge — pr-review's first hook. Operator decision 13: a
# blocked merge is an ordinary outcome reported on the PR, but a squash into `main`
# that deploys `lawncare-saas` without a human is the one event in this chain worth
# interrupting someone for.
#
# The enrichment needs no change to the script: report_merged publishes `pr_url` and
# `issue_number` as context_updates, which is exactly what discord-notify.sh already
# greps the run state for. Before this stage those two existed only in files, so the
# merge notification would have carried a run link and nothing else.
[[run.hooks]]
id = "discord-merged"
# checkpoint_saved, not stage_complete: the composite lifecycle runs git -> event ->
# hook on checkpoint, so the envelope carrying pr_url and issue_number has already
# been written when the hook fires. stage_complete races that write — the same race
# `discord-complete` in backlog was moved here to avoid.
event = "checkpoint_saved"
# Anchored at the end, with the import's `.` prefix allowed: the running id for this
# node is `review_merge.report_merged` (imports prefix node ids), so a bare
# `^report_merged$` matches nothing and the hook is silent. Matchers are tested against
# node_id, handler_type, edge_to, edge_from and tool_name.
matcher = "(^|[.])report_merged$"
# A Discord outage must not stall a run, and by the time this fires the merge has
# already happened, so blocking would achieve nothing.
blocking = false
# sandbox = false runs it inside the fabro server container, where the webhook URL
# and dev token live. That is also why it can never read a tracked copy: no git, no
# checkout. See task 07.
sandbox = false
script = "/storage/scripts/discord-notify.sh merged"

# Model escalation: alert when a rebase leaves the local coder box for a hosted
# model. Two stages qualify: `rebase_agent_t2` (the rebase ladder's glm-5.3 tier)
# and `ci_fix_t2` (the imported review-merge CI-fix ladder's glm-5.3 tier, which
# arrives as `review_merge.ci_fix_t2`). `rebase_agent_t1` stays on a box and does
# not alert.
#
# The matcher is `(^|[.])...$`, not `^...$`, because the imported node keeps its
# prefix and the hook context carries the prefixed id verbatim. The node -> model
# map lives in discord-notify.sh's `fallback` kind. See the same hook in backlog's
# workflow.toml for the full reasoning.
[[run.hooks]]
id = "discord-fallback"
event = "stage_start"
matcher = "(^|[.])(rebase_agent_t2|ci_fix_t2)$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh fallback"
