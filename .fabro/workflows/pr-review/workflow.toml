# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"
# fabro's own run API, which the box-claim hook calls to cancel a background run on this
# run's box (more-local-inference C4). `FABRO_API_URL` is the host's API base URL and
# `FABRO_API_TOKEN` the credential; neither is what `pr_handoff` needs, because pr-review
# never fires another run.
FABRO_API_URL   = "{{ vars.FABRO_API_URL }}"
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
# The boxes' strix-infer `/health` endpoints, as `pool=url` pairs (more-local-inference C3),
# where **pools sharing a URL are one box** (two-slot boxes D1): each strix box serves two
# concurrent sessions, so the value is
# `coders-a=http://10.10.0.29:5300/health,coders-b=http://10.10.0.29:5300/health,coders-c=http://10.10.0.56:5300/health,coders-d=http://10.10.0.56:5300/health`.
# `box-claim` reads it to find this run's box — the URL, and every pool that shares it. A
# `{{ vars.X }}` that is not provisioned fails the RunIntent at compile time, so the server
# variable must exist before this ships.
FABRO_BOX_HEALTH = "{{ vars.FABRO_BOX_HEALTH }}"
# FlakeRadar's base URL (ADR 0028 F1): watch_checks asks it whether a red check fails only on
# known flaky tests. Empty means today's path.
FLAKERADAR_URL = "{{ vars.FLAKERADAR_URL }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage; matcher ^agent$ fires on the agent handler type, so it covers
# every agent node including the imported review-merge phase. blocking = true,
# sandbox = true: the binary lives in the profile image, and a missing or too-old
# binary must stop the stage. A retry starts a new visit (task 02 spike6b).
# docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# stage-end (#93): a stage that ended `succeeded` without submitting a result for its visit runs
# again, at most twice, and then its gate decides. The box model sometimes ends a session on a
# malformed tool call printed as text, which fabro takes as the answer. `stage_complete` marks
# the visit; `edge_selected` is blocking because fabro reads its override only then. `exit 0`
# covers an image with no `stage-end`. The stages and both hooks are R18's: do not edit by hand.
[[run.hooks]]
id = "io-stage-complete"
event = "stage_complete"
matcher = "^(review_merge[.]refute_fix)$"
blocking = false
sandbox = true
timeout = "30s"
script = "fabro-io stage-end review_merge.refute_fix; exit 0"

[[run.hooks]]
id = "io-stage-end"
event = "edge_selected"
matcher = "^(review_merge[.]refute_fix)$"
blocking = true
sandbox = true
timeout = "30s"
script = "fabro-io stage-end review_merge.refute_fix; exit 0"

# box-claim (more-local-inference C3, C4): before every agent stage, give the box back to
# this run. It cancels the background run the scheduler put on the box, then waits for
# strix-infer to report the box idle, on two consecutive reads. blocking = true, because a
# box stage that starts while another run is mid-request interleaves two sessions on one
# box and thrashes its KV cache (ADR 0031 D1). sandbox = true: it needs the manifest, the
# run's box file and the fabro-io binary, all inside the sandbox. The command gives up
# after 45 s and every HTTP call times out at 5 s, so the 60 s hook timeout below is the
# backstop; a blocking hook's wait counts toward the run's stall_timeout, which is 60m in
# all three coder loops. It exits 0 on every path of its own, and the trailing `exit 0`
# covers the one case the command cannot: a fabro-io missing from an older image (exit
# 127), because fabro treats ANY non-zero hook exit as a block.
[[run.hooks]]
id = "box-claim"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "60s"
script = "fabro-io box-claim; exit 0"

# git-guard (docs/coder-tweaks 05, C2): blocks mutating git (`stash`, `checkout --`, `commit`,
# `fetch`, ...) from an agent's `shell` outside the stages the manifest marks `"git": "write"`
# (resolve_merge, rebase_agent_t1/t2); the reason names `restore_file` / `baseline_check`.
# matcher ^shell$ is tested against tool_name. blocking = true, sandbox = true. ANY non-zero
# exit but 2 also blocks (fabro's parse_decision), so a `fabro-io` missing from an old image
# (exit 127) would fail every shell call: the wrapper turns every code but 2 into 0. It is a
# guard against mistakes, not a boundary: `sh -c` and `python` bypass it.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# io-guard (ADR 0016): blocks the refuter from reading Sealed paths (the other
# reviewers' outputs) via pre_tool_use. It began on the imported
# refute and refute_fix nodes; the matcher below names every stage it covers now. A guard against mistakes (D8):
# it must not stop the stage. docs/stage-io/.
# #92 (2026-11-24): review/hygiene_rulings.json, which refute_gate alone writes, is Sealed for every
# merge-phase agent stage that can run after refute_gate, so the guard runs on all eight of them; an
# agent that wrote the file would have ci_fix_gate's counter re-run read it as a ruling. The matcher
