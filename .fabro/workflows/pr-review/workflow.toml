","type":"object"}}},"review_merge.refute":{"inputs":[{"about":"the issues this PR closes, each with number, title and body; may be []","name":"issues","path":"/tmp/fabro/review/refute_issues.json","required":true},{"about":"the PR number, title, body, refs and labels","name":"pr","path":"/tmp/fabro/pr.json","required":true},{"about":"the diff of the PR against its base, smallest files first, cut off at about 300 KB","name":"diff","path":"/tmp/fabro/review/refute_diff.patch","required":true},{"about":"the changed files that did not fit in the diff, one per line with their changed-line count; may be empty","name":"omitted","path":"/tmp/fabro/review/refute_omitted.txt","required":true},{"about":"the diff-hygiene counters; samples lists where each fired","name":"hygiene","path":"/tmp/fabro/review/hygiene.json","required":true}],"output":{"path":"/tmp/fabro/review/refute.json","schema":{"$id":"refute","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The refuter's output for ADR 0016. Every shape check in review-merge's refute_gate first jq program becomes a rule here; the verdict itself (pass only when every criterion is met and there are no defects) is computed by refute_gate and is NOT expressible as a schema, so it stays in the gate. A valid Input receipt proves this schema passed (submit stamped _io). _io is stamped by the server and is not part of this schema.","properties":{"criteria":{"description":"The requirements of the closed issues (or the PR description when there are none), one entry each.","items":{"additionalProperties":false,"description":"One requirement and how it was tested.","properties":{"criterion":{"description":"The requirement, quoted or closely paraphrased, in one sentence.","minLength":1,"type":"string"},"evidence":{"description":"path/to/file.py:42 and what it shows, or what is missing and where you looked.","minLength":1,"type":"string"},"status":{"description":"met: you can cite the file: