_version = 1

[workflow]
graph = "workflow.fabro"

# One model for review and fixes; coders only for the first rebase attempt.
# Quoted keys are mandatory where the name contains a dot, or TOML builds a
# nested table and the automation fire returns 422.
[run.model.fallbacks]
"glm-5.3" = ["litellm:kimi-k3"]
coders = ["litellm:glm-5.3"]
# The scheduler pins a run to one box by naming `coders-a` or `coders-b` in the
# run's `coder_pool` input (see the stylesheet). Fallbacks are keyed on the
# REQUESTED model name, so each pinned group needs its own entry or a pinned run
# has no fallback at all. Same target as `coders` above -- review and fixes stay
# on glm-5.3, and only the first rebase attempt runs on a box.
"coders-a" = ["litellm:glm-5.3"]
"coders-b" = ["litellm:glm-5.3"]
kimi-k3 = ["litellm:glm-5.3"]

# The run works on the PR head branch, not on fabro/run/<id>.
#   enabled = true  -> checkpoints still commit between stages, onto the PR branch
#   push    = false -> fabro never pushes the stale fabro/run/<id>; `deliver` pushes
# Legal only because there is no pull-request block in this workflow. Do not add one.
[run.run_branch]
enabled = true
push = false

# Nothing reads a pushed metadata branch; leaving it on leaks one branch per run.
[run.meta_branch]
push = false

# Full history. `depth` defaults to 100 (RunCloneSettings::DEFAULT_DEPTH) and `depth = 0`
# means unlimited. A shallow clone breaks every git operation this workflow is built
# on: `git diff origin/<base>...HEAD` dies with `fatal: no merge base` when the branch
# point is behind the graft, `git log origin/<base>..HEAD` lists commits that are
# already on the base branch, `merge-base --is-ancestor` answers no when the answer is
# yes, and `git rebase` silently drops commits as "patch contents already upstream".
# `claim` also runs `git fetch --unshallow` as a belt-and-braces guard; keep both.
[run.clone]
depth = 0

# `issues` must be "write", not "read". `claim` runs `gh label create` for the two
# terminal labels, and repository labels are the Issues permission in GitHub's model
# (`POST /repos/{owner}/{repo}/labels`); `gh pr edit --add-label` goes through the
# issue-labels endpoint too. These labels never pre-exist — backlog uses
# agent-authored / agent-in-progress / Review — so `claim` is the only thing that
# creates them. With "read" every label call fails, and because they are all
# `|| true` the run still reports success: the terminal state quietly degrades from
# "label + comment" to comment-only. `closingIssuesReferences` only needs read, but
# the label writes decide the level.
[run.integrations.github.permissions]
contents = "write"
issues = "write"
pull_requests = "write"

# Host-wide kill switch for the merge phase. Task 06's other switch is per repo and
# lives on the `pr-review-<repo>` automation row; `validate_input` resolves both into
# /tmp/fabro/auto_merge, and `merge_gate` blocks unless it reads exactly 1.
#
# `{{ vars.X }}`, not `${X}`. Shell-style `${X}` is NOT interpolated here: it reaches
# the sandbox as the literal seven-plus characters. Probed on 2026-09-16 against
# 0.354.0-nightly.0 with `PROBE = "${HOME}"`, whose stage printed `[${HOME}]`. Because
# the literal is set and is not `1`, that spelling pinned the host switch to OFF on
# every repo forever, and no operator action could arm it -- a failure the task 10
# shakedown could not have caught, because a permanently-off switch and a correctly
# disarmed one produce the same blocked run.
#
# fabro names the right mechanism in the error for `{{ env.X }}`: "the process
# environment is not a configuration source. Use {{ vars.X }} for a non-sensitive
# value (`fabro variable set`) or {{ secrets.X }} for a credential". A server variable
# is right here -- `0` or `1` is not a credential.
#
# Consequence, and it is deliberate: **the variable must exist**. An unset one fails
# the RunIntent at compile time ("Run config variable interpolation failed"), so no run
# is created at all. `ops/provision-server-state.sh` creates it, and task 09 asserts it
# is present. In exchange the kill switch costs one call and takes effect on the next
# run -- no `.env` edit, no `docker compose up -d`, no restart:
#
#     ops/fabro-auto-merge-switch.sh host off
#
# [run.environment.*] is a SPARSE OVERRIDE on the environment the automation already
# selected: pr-review picks `python`, `python-node`, `ts` or `rust-node` per repo.
# Do NOT add `[run.environment] id = "..."` -- that would pin all four pr-review
# automations to one image, break the per-repo mapping, and fail `fabro validate`,
# which resolves a non-default id against the CLI's own local catalog.
[run.environment.env]
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"

# Discord notification on a merge — pr-review's first hook. Operator decision 13: a
# blocked merge is an ordinary outcome reported on the PR, but a squash into `main`
# that deploys `lawncare-saas` without a human is the one event in this chain worth
# interrupting someone for.
#
# The enrichment needs no change to the script: report_merged publishes `pr_url` and
# `issue_number` as context_updates, which is exactly what discord-notify.sh already
# greps the run state for. Before this stage those two existed only in files, so the
# merge notification would have carried a run link and nothing else.
[[run.hooks]]
id = "discord-merged"
# checkpoint_saved, not stage_complete: the composite lifecycle runs git -> event ->
# hook on checkpoint, so the envelope carrying pr_url and issue_number has already
# been written when the hook fires. stage_complete races that write — the same race
# `discord-complete` in backlog was moved here to avoid.
event = "checkpoint_saved"
# Anchored. Matchers are unanchored regexes tested against node_id, handler_type,
# edge_to, edge_from and tool_name; `report_merged` does not prefix one today, but
# `report_blocked` shares seven characters with it.
matcher = "^report_merged$"
# A Discord outage must not stall a run, and by the time this fires the merge has
# already happened, so blocking would achieve nothing.
blocking = false
# sandbox = false runs it inside the fabro server container, where the webhook URL
# and dev token live. That is also why it can never read a tracked copy: no git, no
# checkout. See task 07.
sandbox = false
script = "/storage/scripts/discord-notify.sh merged"
