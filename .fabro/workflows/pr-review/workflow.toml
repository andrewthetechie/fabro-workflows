te","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The refuter's output for ADR 0016. Every shape check in review-merge's refute_gate first jq program becomes a rule here; the verdict itself (pass only when every criterion is met and there are no defects) is computed by refute_gate and is NOT expressible as a schema, so it stays in the gate. `hygiene` carries the refuter's rulings on the diff-hygiene hits (#92): one entry per `tests_deleted` or `asserts_removed` hit, each `legitimate`, `tampering` or `unsure`, and `[]` when there is no such hit. This schema checks the shape of a ruling only: whether the evidence behind a `legitimate` ruling holds is refute_gate's check, and a ruling that fails it becomes `unsure`. A valid Input receipt proves this schema passed (submit stamped _io). _io is stamped by the server and is not part of this schema.","properties":{"criteria":{"description":"The requirements of the closed issues (or the PR description when there are none), one entry each.","items":{"additionalProperties":false,"description":"One requirement and how it was tested.","properties":{"criterion":{"description":"The requirement, quoted or closely paraphrased, in one sentence.","minLength":1,"type":"string"},"evidence":{"description":"path/to/file.py:42 and what it shows, or what is missing and where you looked.","minLength":1,"type":"string"},"status":{"description":"met: you can cite the file:line that implements it and found nothing contradicting it. not_met: missing, partly done, or contradicted by the code. unverifiable: you cannot tell from the code and the diff; say what evidence is missing.","enum":["met","not_met","unverifiable"]}},"required":["criterion","status","evidence"],"type":"object"},"minItems":1,"type":"array"},"defects":{"description":"What a careful maintainer would refuse to merge. Empty when none found.","items":{"additionalProperties":false,"description":"A concrete wrong behavior, crash,