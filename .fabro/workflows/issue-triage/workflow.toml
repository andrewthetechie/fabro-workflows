_version = 1

[workflow]
graph = "workflow.fabro"

# high-reasoning is a role alias on zai:glm-5.3 (ADR 0003, reversed by
# direct-providers task 03). When z.ai is rate-limited or errors, the overflow
# that used to live inside LiteLLM now falls back here, to Kimi's kimi-k3.
[run.model.fallbacks]
high-reasoning = ["kimi:kimi-k3"]

# Triage reads code and writes issues. It never writes code, so `contents` is "read".
# `issues` must be "write": the run creates labels (needs-info, triage-in-progress,
# agent), edits titles and bodies, and comments. Repository labels are the Issues
# permission in GitHub's model.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# Nothing in this package commits. No run branch and no checkpoint commits (0.362: enabled = false also skips checkpoint commits).
[run.run_branch]
enabled = false

# [run.environment.env] holds only FABRO_IO_MANIFEST (ADR 0016): the stage
# manifest travels with the graph via env (D4). The capacity gate that was the
# original consumer of the environment is deleted, and nothing else in this package
# reads it, so the block stays deliberately minimal — an unset FABRO_API_TOKEN
# used to abort every triage run at compile time, and [run.environment.env] reaches
# agent execution as well as command execution, so keeping only the manifest in it
# shrinks the trust surface. See docs/adr/0005-scheduler-owns-admission.md.

# Discord. Hooks run with sandbox = false, inside the fabro server container (Alpine:
# /bin/sh, wget, no bash, no jq, no curl), and read the webhook URL from
# /storage/secrets/discord_webhook_url. The script is referenced by absolute container
# path because hook `script` is a shell command, not an `@` file import.
#
# The triage phase is imported, so its node ids are prefixed (`triage_phase.release`).
# A bare `^release$` matches nothing, and a hook that matches nothing is silent.
# fabro-io (ADR 0016): one streamable-HTTP MCP server per agent stage, in the
# profile-image sandbox (type = sandbox -> the image runs the static binary). The
# server lists no tools until a stage is live, so until tasks 07-10 this only adds
# a server start (~0.3 s, spike check 2) and one stage hook to every agent stage.
# docs/stage-io/.
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
tool_timeout = "30s"

[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"min_binary":"0.1.0","stages":{"triage_phase.improve":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the single issue, with .body as the report, .title the current title, .comments the human discussion, .labels what the repository already believes","name":"issue.json","path":"/tmp/fabro/issue.json","required":true}],"output":{"path":"/tmp/fabro/improve.json","schema":{"$id":"improve","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The triage improve agent's output (docs/stage-io, task 10). improve_gate writes the body verbatim over the issue. _io is stamped by the server.","properties":{"body":{"description":"The complete revised issue body in Markdown; written verbatim over the issue.","type":"string"},"reason":{"description":"One or two sentences on what changed and why, or why nothing did.","type":"string"},"status":{"enum":["improved","unchanged"]},"title":{"description":"A clearer plain-English title, or the original unchanged.","type":"string"}},"required":["status","title","body","reason"],"title":"improve \u2014 triage's improved issue body (task 10)","type":"object"}}},"triage_phase.plan":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the improved issue, with .body as the improved body, .title, .comments and .labels","name":"issue.json","path":"/tmp/fabro/issue.json","required":true},{"about":"the triage verdict: readiness, the acceptance boundary, labels and title","name":"triage.json","path":"/tmp/fabro/triage.json","required":true},{"about":"the triage report, including the acceptance boundary","name":"triage.md","path":"/tmp/fabro/triage.md","required":true}],"output":{"path":"/tmp/fabro/plan.json","schema":{"$id":"plan","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The plan agent's output. Encodes plan_gate's shape checks at the structural level: a non-empty tasks array whose entries carry non-empty id/title/intent and array files/covers, unique ids, a children array (empty for a map, else objects with title/summary/criteria/tasks and an after index), and a summary. The cross-field split rules (children count by task count, coverage, ordering, after range, conventional child titles) are gate checks and stay in the gate. _io is stamped by the server.","properties":{"children":{"items":{"additionalProperties":false,"properties":{"after":{"anyOf":[{"minimum":0,"type":"integer"},{"type":"null"}]},"criteria":{"description":"The parent's acceptance criteria this child delivers, quoted from the issue.","items":{"minLength":1,"type":"string"},"minItems":1,"type":"array"},"summary":{"minLength":1,"type":"string"},"tasks":{"items":{"type":"string"},"type":"array"},"title":{"minLength":1,"type":"string"}},"required":["title","summary","criteria","tasks","after"],"type":"object"},"type":"array"},"summary":{"description":"One sentence for the operator.","minLength":1,"type":"string"},"tasks":{"items":{"additionalProperties":false,"properties":{"covers":{"items":{"type":"string"},"type":"array"},"files":{"items":{"type":"string"},"type":"array"},"id":{"minLength":1,"type":"string"},"intent":{"minLength":1,"type":"string"},"title":{"minLength":1,"type":"string"}},"required":["id","title","intent","files","covers"],"type":"object"},"minItems":1,"type":"array"}},"required":["tasks","children","summary"],"title":"plan \u2014 triage's proposed task map (ADR 0015, task 02)","type":"object"}}},"triage_phase.triage":{"inputs":[{"about":"a ranked outline of this checkout; can be missing, continue without it","absent":"the repository map is missing; proceed without it","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the single issue refreshed after improve, with .title, .comments and .labels","name":"issue.json","path":"/tmp/fabro/issue.json","required":true}],"output":{"path":"/tmp/fabro/triage.json","schema":{"$id":"triage","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"The triage agent's output (docs/stage-io, task 10). Encodes triage_gate's shape checks: readiness enum, conventional title, labels nameset, questions policy per readiness, non-empty question/decision. `basis` per decision for non-architecture issues is a gate check depending on issue.json and stays in the gate. _io is stamped by the server.","properties":{"classification":{"enum":["bug","enhancement","mixed"]},"confidence":{"enum":["high","medium","low"]},"decisions":{"items":{"additionalProperties":false,"properties":{"basis":{"description":"The repository path that settles the question. triage_gate requires it non-empty unless the issue carries the architecture label, and the renderers print it.","type":"string"},"decision":{"minLength":1,"type":"string"},"question":{"minLength":1,"type":"string"}},"required":["question","decision"],"type":"object"},"type":"array"},"labels":{"items":{"pattern":"^[a-z0-9:._-]+$","type":"string"},"type":"array"},"questions":{"items":{"additionalProperties":false,"properties":{"id":{"minLength":1,"type":"string"},"question":{"minLength":1,"type":"string"},"recommended":{"type":"string"},"why":{"type":"string"}},"required":["id","question","why"],"type":"object"},"type":"array"},"readiness":{"enum":["ready","needs_info","not_actionable"]},"summary":{"description":"One sentence for the operator.","type":"string"},"title":{"pattern":"^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\\([a-z0-9 ./_-]+\\))?: .+","type":"string"}},"required":["readiness","classification","confidence","title","labels","questions","decisions","summary"],"title":"triage \u2014 triage's verdict (task 10)","type":"object"}}}},"version":1}'''
# END fabro-io manifest
# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage; matcher ^agent$ fires on the agent handler type, so it covers
# every agent node including the imported triage phase. blocking = true,
# sandbox = true: the binary lives in the profile image, and a missing or too-old
# binary must stop the stage. A retry starts a new visit (task 02 spike6b).
# docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

[[run.hooks]]
id = "discord-triage-question"
event = "stage_start"
matcher = "(^|[.])post_questions$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-question"

# The phase's failure path. `release` exits zero and routes to `done`, so the run ends
# succeeded and run_failed never fires for it.
[[run.hooks]]
id = "discord-triage-failed"
event = "stage_start"
matcher = "(^|[.])release$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-failed"

# Belt and braces for a failure that never reaches `release` at all — a sandbox that
# fails to start, a compile error, a token rejected at admission.
[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"
