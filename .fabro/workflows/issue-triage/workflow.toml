_version = 1

[workflow]
graph = "workflow.fabro"

# high-reasoning is a role alias on zai:glm-5.3 (ADR 0003, reversed by
# direct-providers task 03). When z.ai is rate-limited or errors, the overflow
# that used to live inside LiteLLM now falls back here, to Kimi's kimi-k3.
[run.model.fallbacks]
high-reasoning = ["kimi:kimi-k3"]

# Triage reads code and writes issues. It never writes code, so `contents` is "read".
# `issues` must be "write": the run creates labels (needs-info, triage-in-progress,
# agent), edits titles and bodies, and comments. Repository labels are the Issues
# permission in GitHub's model.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# Nothing in this package commits. No run branch and no checkpoint commits (0.362: enabled = false also skips checkpoint commits).
[run.run_branch]
enabled = false

# No [run.environment.env]. The only consumer was the deleted capacity gate, which
# called the fabro API; nothing else in this package reads the environment.
# Dropping the block drops two hard startup dependencies with it — an unset
# FABRO_API_TOKEN aborted every triage run at compile time — and it shrinks the
# trust surface, because [run.environment.env] reaches agent execution as well as
# command execution. See docs/adr/0005-scheduler-owns-admission.md.

# Discord. Hooks run with sandbox = false, inside the fabro server container (Alpine:
# /bin/sh, wget, no bash, no jq, no curl), and read the webhook URL from
# /storage/secrets/discord_webhook_url. The script is referenced by absolute container
# path because hook `script` is a shell command, not an `@` file import.
#
# The triage phase is imported, so its node ids are prefixed (`triage_phase.release`).
# A bare `^release$` matches nothing, and a hook that matches nothing is silent.
[[run.hooks]]
id = "discord-triage-question"
event = "stage_start"
matcher = "(^|[.])post_questions$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-question"

# The phase's failure path. `release` exits zero and routes to `done`, so the run ends
# succeeded and run_failed never fires for it.
[[run.hooks]]
id = "discord-triage-failed"
event = "stage_start"
matcher = "(^|[.])release$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh triage-failed"

# Belt and braces for a failure that never reaches `release` at all — a sandbox that
# fails to start, a compile error, a token rejected at admission.
[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"
