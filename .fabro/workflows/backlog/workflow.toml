# END fabro-io manifest
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
# Read by pr_handoff for the per-repo auto-merge switch, and by the imported
# review-merge phase for the host-wide one.
FABRO_API_URL    = "{{ vars.FABRO_API_URL }}"
FABRO_AUTO_MERGE = "{{ vars.FABRO_AUTO_MERGE }}"

# Discord notifications. Hooks run with sandbox = false, which means they run
# inside the fabro server container (Alpine: /bin/sh, wget, no bash, no jq, no
# curl). The webhook URL is read from /storage/secrets/discord_webhook_url
# inside that container, so no secret enters this repo or this TOML. The script
# is referenced by absolute container path because hook `script` is a shell
# command, not an `@` file import.
# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of
# every agent stage, so the MCP server, guard and gates share one identity per
# visit. matcher ^agent$ fires on the agent handler type, so it covers every agent
# node including the imported review-merge phase. blocking = true, sandbox = true:
# fabro-io lives in the profile image, and a missing or too-old binary must stop the
# stage, not let it run without I/O guardrails. A retry starts a new visit (task 02
# spike6b), so no stage_retrying reset is needed. docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# io-guard (ADR 0016): blocks the refuter from reading Sealed paths (the other
# reviewers' outputs) via a pre_tool_use hook, so it can never see them through
# read_file. matcher (^|[.])refute$ matches the imported review_merge.refute node id
# and never a tool name. blocking = true, sandbox = true, same reason as io-stage.
# It is a guard against mistakes (D8): it must not stop the stage. docs/stage-io/.
[[run.hooks]]
id = "io-guard"
event = "pre_tool_use"
matcher = "(^|[.])refute$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io guard"

[[run.hooks]]
id = "discord-rescue"
event = "stage_start"
matcher = "human_rescue"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh rescue"

# Fires when open_pr's CHECKPOINT is saved — i.e. the run actually produced a
# pull request AND the checkpoint carrying `pr_url` has been persisted, so the
# notification can link it with no race. The composite lifecycle runs
# git -> event -> hook on checkpoint (fabro-workflow lifecycle/mod.rs), so the
# event lifecycle has already written the checkpoint envelope by the time this
# hook runs.
#
# History: this was `run_complete`, which has no matcher support and so fired on
# every run including the ~384/day that quiet-exit at `acquire`; then
# `stage_start`, which fires before the PR exists; then `stage_complete`, which
# races the checkpoint write that publishes `pr_url`.
[[run.hooks]]
id = "discord-complete"
event = "checkpoint_saved"
# Anchor the matcher: fabro_hooks compiles `matcher` as an unanchored regex
# and tests it against node_id, so `open_pr` would ALSO match `open_pr_prep`
# and notify twice. `^open_pr$` matches only the PR-opening stage.
matcher = "^open_pr$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh complete"

[[run.hooks]]
id = "discord-failed"
event = "run_failed"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh failed"

# The three terminal reports of the imported review-and-merge phase. Every one of
# them notifies, because each asks the operator for something different.
#
# History, and why this block exists at all. Before 54c21be this phase was a separate
# `pr-review` run reached by a `trigger_review` bridge node, and the merge
# notification lived in `pr-review/workflow.toml`. That commit deleted the bridge and
# spliced the phase into this run with `review_merge [import=...]`; the notification
# was not carried across, so `pr-review/workflow.toml` kept the only `report_merged`
# hook and this file gained none for any report node. A scheduler-dispatched run —
# now the only kind there is — pinged `^open_pr$` when the PR opened and then said
# nothing about what the review decided, in either direction. Run
# 01M2X2MYMR2XP5XANKH7D7XS2W is the concrete case: it reviewed lawncare-saas PR
# #2601, declined to merge, ended `succeeded`, and produced no notification, no
# label and no failed-run event.
#
# Ids arrive prefixed from the import (`review_merge.report_blocked`). Anchor at the
# end and allow the import's `.` prefix: `(^|[.])report_merged$`. A bare `^report_merged$`
# matches neither the prefixed id nor anything else, and the runner logs nothing for an
# event with no matching hook, so a matcher that cannot match is silent. Verified on run
# 01M2XEP62DVGS9JJT9CZQ7HE2Q: it checkpointed `review_merge.report_blocked` and the
# anchored hook produced no `Running hooks` line. The `$` still keeps `report_blocked`
# from matching `report_merged`.
#
# `checkpoint_saved`, not `stage_complete`: the report node's context writes
# (`pr_url`, `review_merge_outcome`) are in the checkpoint envelope by the time the
# hook runs, the same race the `discord-complete` hook above was moved here to
# avoid. blocking = false so a Discord outage cannot stall a run; sandbox = false so
# it runs in the server container, where the webhook URL and dev token already live.
[[run.hooks]]
id = "discord-merged"
event = "checkpoint_saved"
matcher = "(^|[.])report_merged$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh merged"

# The EXPECTED block. The review completed and the PR is healthy, but something made
# it ineligible for automatic merge: the kill switch, a reviewer verdict, or CI the
# fix ladder could not land. The reason is written to the PR as a comment by that
# node; it lives in the run's sandbox and never reaches the run context, so this
# message cannot carry it and links the PR instead.
[[run.hooks]]
id = "discord-blocked"
event = "checkpoint_saved"
matcher = "(^|[.])report_blocked$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh blocked"

# The UNEXPECTED path: the phase could not produce a verdict at all. The PR gains
# `ai-review-needs-human`, which is the label to watch for.
[[run.hooks]]
id = "discord-needs-human"
event = "checkpoint_saved"
matcher = "(^|[.])mark_needs_human$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh needs-human"

# Model escalation: alert when a task or a merge-resolution leaves the local
# coder box for a hosted model. The stages are the coder ladder's hosted tiers
# (rework_t2 -> glm-5.3-flash, rework_t3 -> kimi-for-coding, rework_t4 -> glm-5.3),
# the merge resolver (resolve_merge, also glm-5.3), and the imported CI-fix
# escalation (review_merge.ci_fix_t2, glm-5.3). The alert is informational: the
# ladder itself is the system working, so nothing blocks.
#
# stage_start, not checkpoint_saved: the escalation begins when the stage starts,
# which is the moment the local box is left.
#
# The matcher is `(^|[.])...$`, not `^...$`. Nodes spliced in with `import=` keep
# a prefixed id (`review_merge.ci_fix_t2`), and the hook context carries that id
# verbatim (fabro-hooks/src/runner.rs matches against node_id, handler_type,
# edge_to, edge_from, tool_name). An anchored `^ci_fix_t2$` matches neither the
# prefixed nor the bare id, and a non-matching hook is silent: the runner skips
# the whole event with no log line. The `$` still keeps `rework_t2` from matching
# a hypothetical `rework_t20`, so anchoring is not lost.
#
# blocking = false so a Discord outage cannot stall a run; sandbox = false so the
# script runs in the server container, where the webhook lives. Absolute container
# path because hook `script` is a shell command, not an `@` file import. The
# node -> model map lives in discord-notify.sh's `fallback` kind, because one
# matcher covers six nodes with three different models.
[[run.hooks]]
id = "discord-fallback"
event = "stage_start"
matcher = "(^|[.])(rework_t[2-4]|resolve_merge|ci_fix_t2)$"
blocking = false
sandbox = false
script = "/storage/scripts/discord-notify.sh fallback"
