_version = 1

[workflow]
graph = "workflow.fabro"

# Model escalation fallbacks. A model that errors or is rate-limited falls
# through to the next one. Order follows the operator's quota policy:
# z.ai before kimi. long-context and kimi-k3 never fall back into a coder
# role, and kimi-k3 is never a primary coder.
#
# Targets name the provider directly (zai:/kimi:) since task 03 pointed the
# hosted models at their own providers; the proxy is gone.
#
# Keys containing a dot MUST be quoted or the TOML parse fails with a 422 at
# automation fire time.
[run.model.fallbacks]
# The scheduler pins a run to one box by naming `coders-a` or `coders-b` in the
# run's `coder_pool` input (see the stylesheet). Fallbacks are keyed on the
# REQUESTED model name, so each pinned group needs its own entry or a pinned run
# has no fallback at all. The both-boxes `coders` key has no home anymore --
# task 04 retired that id with the LiteLLM provider (ADR 0007) and an unpinned
# run resolves to `coders-a`; pinning changes only which box answers, never the
# escalation ladder.
#
# Nothing falls back to glm-4.7 and no stylesheet class may name it: it is the
# only model in the server catalog with `features.reasoning: false`, the z.ai
# endpoint returns reasoning blocks from it anyway, and replaying one costs the
# stage outright (`LLM error: model zai/glm-4.7 does not support reasoning`).
# The graph comment above `model_stylesheet` carries the full reasoning. It is
# worth knowing that a fallback would not have saved the stage even if the
# target were sound -- the failure classifies `api_deterministic|...|
# invalid_request`, and this table only covers errors and rate limits.
# The implementer (.coder, plus .improve/.rebase which share the box) escalates on the
# REQUESTED box's own chain: the local box -> zai:glm-5.3-flash -> the openai
# escalation gpt-6-luna. Fallbacks are non-recursive (one lookup from the original
# request; a target's own row is never consulted), so glm-5.3-flash's row below does
# NOT extend this chain -- every rung must be listed here.
"coders-a" = ["zai:glm-5.3-flash", "openai:gpt-6-luna"]
"coders-b" = ["zai:glm-5.3-flash", "openai:gpt-6-luna"]
kimi-for-coding = ["zai:glm-5.3"]
"glm-5.3" = ["kimi:kimi-k3"]
# The adversarial reviewer (.refute). Non-GLM, and its fallback is likewise non-GLM:
# a refute outage degrades to the sibling openai model, and the merge gate keeps its
# adversarial independence either way.
"gpt-6.1-sol" = ["openai:gpt-6-luna"]
# The mechanical-check tier (.review-standards, .merge-standards) and, since
# glm-4.7 was removed, the first hosted rung of the coder ladder (.coder-t2) and
# the landing spot for a failed local box. It escalates UP to full glm-5.3 rather
# than sideways, so a flash outage degrades into a better model and never a worse
# one. This row applies only to classes that REQUEST flash; the implementer's chain
# lives in the coders-a/coders-b rows (fallbacks are non-recursive).
"glm-5.3-flash" = ["zai:glm-5.3"]
kimi-k3 = ["zai:glm-5.3"]
long-context = ["kimi:kimi-k3"]

# Checkpoints still COMMIT after every stage, but fabro no longer PUSHES them
# (ADR 0011 D1). Every checkpoint is an allow-empty commit, and once the PR exists
# each push started a full CI run: womens-fantasy-sports#1247 carried 80 commits
# and 78 Actions runs. The push after `watch_checks` also moved the head CI had
# just passed, so `merge` timed out waiting for CI to start over.
#   enabled = true  -> checkpoints still commit between stages
#   push    = false -> only open_pr, deliver, ci_fix_gate and remerge_base push
# open_pr widens the fetch refspec for the run branch; without that, every later
# `--force-with-lease` push is rejected as `stale info` on this single-branch clone.
# Nothing resumes from a pushed run branch (a server restart fails the run and any
# retry starts from a fresh clone), so the old "survives a crash" reason is void.
# Legal only because there is no [run.pull_request] block in this workflow.
[run.run_branch]
enabled = true
push = false

# The run needs a GitHub token for the gh CLI in acquire/claim/validate/open_pr
# command stages and for agent use of gh. Fabro injects GITHUB_TOKEN into the
# sandbox; these permissions declare what a token-mode run may do.
[run.integrations.github.permissions]
contents = "write"
issues = "write"
pull_requests = "write"

# `FABRO_API_TOKEN` is how a command node reaches this server's own API: `pr_handoff`
# reads the per-repo auto-merge switch off the `pr-review-<repo>` automation row, and
# the imported review-merge phase reads the host-wide one. The token is a vault entry
# resolved at launch; only its name appears here, because this repository is public.
#
# [run.environment.*] is a SPARSE OVERRIDE on the environment the automation already
# selected. Do NOT add `[run.environment] id = "..."` — that would pin all four
# backlog automations to one environment and break the per-repo image mapping
# (jelly-swipe needs python, writers-app needs rust-node, and buildpack-deps:noble
# fails CI on two of the four).
# fabro-io (ADR 0016): one streamable-HTTP MCP server per agent stage, in the
# profile-image sandbox (type = sandbox -> the image runs the static binary). The
# server lists no tools until a stage is live, so until tasks 07-10 this only adds
# a server start (~0.3 s, spike check 2) and one stage hook to every agent stage.
# startup_timeout/tool_timeout are large for the cold sandbox first start.
# docs/stage-io/.
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
tool_timeout = "30s"

[run.environment.env]
