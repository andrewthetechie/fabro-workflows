_version = 1

[workflow]
graph = "workflow.fabro"

# Nothing in this package commits, and nothing in a background package may write to GitHub
# before its last node (more-local-inference D9, R16). No run branch and no checkpoint
# commits (0.362: enabled = false also skips checkpoint commits). Left to the default, or to
# the target repository's .fabro/project.toml, a run branch pushes a checkpoint after every
# stage, and a branch push can start CI on the self-hosted runners.
[run.run_branch]
enabled = false

# `claim` lists the issues labelled `fabro-orientation`; `post` writes one issue body, and on
# the run that finds none it creates the issue and pins it. Nothing here touches code or a pull
# request: this package is the one automation that writes an issue body, and it writes only
# its own.
[run.integrations.github.permissions]
contents = "read"
issues = "write"

# A background package (more-local-inference D4, R16): every agent stage's model is
# `{{ inputs.coder_pool }}`, which the scheduler sets to the `-bg` row of the box's first
# pool (`coders-a-bg` on box 1, `coders-c-bg` on box 2, two-slot boxes D3), so a
# map spends no hosted credits (C5). It binds no `[run.inputs]`: `coder_pool` is per-run, and a
# bound one would pin every hand-fired run to one box. It takes no `issue_number`: the subject
# is the repository the run was fired for. There is no `[run.model.fallbacks]` at all: a `-bg` name must not fall back anywhere
# (C5, R14).

# fabro-io (ADR 0016): the MCP server every agent stage carries, and the `io-stage` hook
# below. Without them a stage has no visit, and `gate`'s receipt check reads every check as a
# miss (R11).
[run.agent.mcps.io]
type = "sandbox"
command = ["fabro-io", "serve", "--port", "7391"]
port = 7391
startup_timeout = "20s"
# 660s (docs/coder-tweaks 04): `baseline_check` may run a command for up to 600s.
tool_timeout = "660s"

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to
# cancel this run, and the `/health` URL of this run's box. Written exactly as `box-noop`'s
# are. An unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables
# must exist before this package is used; `ops/provision-server-state.sh` creates them.
[run.environment.env]
# BEGIN fabro-io manifest (generated by ops/fabro-io-manifest.py; do not edit)
FABRO_IO_MANIFEST = '''{"coder_box_stages":{"backlog":{"coder":true,"extra_decompose":true,"plan":"plan-arm","pre_review":true,"resolve_merge":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true,"rework_t1":true},"pr-review":{"rebase_agent_t1":true,"review_merge.refute_fix":true,"review_merge.resolve_base":true},"ralph":{"iterate_t1":true,"learn":true,"plan":"plan-arm","pre_review":true,"resolve_base":true}},"min_binary":"0.9.0","stages":{"map":{"box":true,"inputs":[{"about":"ranked outline of the checkout, produced by fabro-code map in prep; start from it instead of reading the tree","absent":"fabro-code map could not build the outline; start from the top-level directories","name":"repomap.md","path":"/tmp/fabro/repomap.md","required":false},{"about":"the map the last run wrote, and the main= commit it described; it may be stale, so keep what still describes this code and fix what has moved","absent":"there is no earlier map for this repository; write this one from the code","name":"orientation-prior.md","path":"/tmp/fabro/orientation/prior.md","required":false}],"output":{"path":"/tmp/fabro/orientation.json","schema":{"$id":"repo_orientation","$schema":"https://json-schema.org/draft/2020-12/schema","additionalProperties":false,"description":"What a local model found about how one repository is laid out and works: its modules, the conventions a change has to follow, where the tests live and the commands that run them, and the traps a newcomer hits. `gate` requires every cited path to exist in the checkout and holds the rendered map to 6,000 characters. `post` writes it as the body of the repository's one pinned `fabro-orientation` issue, which `backlog`'s and `ralph`'s `prep` copy to /tmp/fabro/orientation.md for `decompose` and `plan`. _io is stamped by the server and is not part of this schema.","properties":{"commands":{"description":"The commands this repository runs, exactly as its own configuration runs them (`Makefile`, `package.json`, `pyproject.toml`, `.fabro/ci.sh`), and what each is for.","items":{"additionalProperties":false,"properties":{"run":{"maxLength":200,"minLength":1,"type":"string"},"why":{"maxLength":160,"minLength":1,"type":"string"}},"required":["run","why"],"type":"object"},"maxItems":6,"minItems":1,"type":"array"},"conventions":{"description":"The rules a change in this repository follows that a newcomer would get wrong: naming, layering, error handling, where a new file goes, what must be updated with it.","items":{"maxLength":220,"minLength":1,"type":"string"},"maxItems":8,"minItems":1,"type":"array"},"gotchas":{"description":"Traps that cost a newcomer a run: a generated file, a second copy of the same logic, a test that needs a service, a directory that looks authoritative and is not.","items":{"maxLength":220,"minLength":1,"type":"string"},"maxItems":5,"type":"array"},"modules":{"description":"The parts of the repository a change lands in, biggest first. A path that does not exist is dropped before anyone sees the map.","items":{"additionalProperties":false,"properties":{"path":{"description":"Repository-relative directory or file, exactly as in the checkout.","maxLength":200,"minLength":1,"type":"string"},"what":{"description":"One line: what lives there and what it is responsible for.","maxLength":200,"minLength":1,"type":"string"}},"required":["path","what"],"type":"object"},"maxItems":10,"minItems":1,"type":"array"},"summary":{"description":"Two or three sentences: what this repository is, and how a change usually gets made in it. Published verbatim.","maxLength":600,"minLength":1,"type":"string"},"tests":{"description":"Where the tests live and what each kind covers.","items":{"additionalProperties":false,"properties":{"path":{"maxLength":200,"minLength":1,"type":"string"},"what":{"maxLength":200,"minLength":1,"type":"string"}},"required":["path","what"],"type":"object"},"maxItems":6,"minItems":1,"type":"array"}},"required":["summary","modules","conventions","tests","commands"],"title":"repo_orientation \u2014 a box-written map of one repository at main (more-local-inference 10)","type":"object"}}}},"version":1}'''
# END fabro-io manifest
# BEGIN fabro agent guide (generated by ops/fabro-io-manifest.py from _io/agent-guide.md; do not edit)
FABRO_AGENT_GUIDE = '''# Tools for code questions

These tools answer a code question in one call and return only what you ask for. A
`grep` plus a `read_file` of the matching file costs far more.

| You want | Use |
|---|---|
| where a function, class or variable is defined | `code_def` NAME |
| the source of one function or class | `code_show` NAME, or `code_show` path:line |
| who calls a function or class | `code_callers` NAME |
| every match of a regex, grouped under the function or class it is in | `code_search` PATTERN [path] |
| what a change to a symbol could break | `code_impact` NAME |
| the tests that import a file | `code_tests` PATHS |
| whether a failure existed before your change | `baseline_check` COMMAND |
| to undo your change to one file | `restore_file` PATH |
| whether your change passes its tests | `run_tests` TARGET [paths] |
| what the gate will run for your change, and whether it passes | `task_check` |

Run `task_check` before you finish: it runs the checks and the tests the Task validation
gate selected for your diff, so you fix what the gate will report.

If the shell says a test needs a database or a service, use `run_tests`; the repository
declares how to start it.

If a tool above is not in your tool list, the shell has the same verbs:
`fabro-code def|show|search|callers|impact|tests ARGS`, and for the two test tools
`fabro-test TARGET [paths]` and `fabro-test --task`.

`grep` and `rg` are right for text that is not a code name: a string, a config key, an
error message. The index knows calls and imports by name only, so confirm with
`grep -rnw NAME` before you conclude that something is unused.

Read a range, not a whole file: `code_show path:line`, or `read_file` with `offset`
and `limit`.

Do not run git commands that change files, the index or branches (`stash`, `checkout`,
`restore`, `reset`, `commit`, `fetch`). To undo your change to a file, use
`restore_file`. To see whether a failure predates your change, use `baseline_check`.
The one exception: if your task prompt says you are the git exception (a merge or
rebase to finish), run the git commands it lists.
'''
# END fabro agent guide

# Read by the `box-guard` hook (C10): the API to list the box's coder loop, the token to cancel
# this run, and the `/health` URL of this run's box. Without them the guard logs one line and
# lets the stage run, so the third layer of D17 is silently absent (R16 checks for them). An
# unset `{{ vars.X }}` fails the RunIntent at compile time, so the server variables must exist
# before this package is used; `ops/provision-server-state.sh` creates them.
FABRO_API_URL   = "{{ vars.FABRO_API_URL }}"
FABRO_API_TOKEN = "{{ secrets.FABRO_API_TOKEN }}"
FABRO_BOX_HEALTH = "{{ vars.FABRO_BOX_HEALTH }}"

# io-stage (ADR 0016): writes stage.json with a fresh 128-bit visit at the start of every
# agent stage. blocking = true, sandbox = true. docs/stage-io/.
[[run.hooks]]
id = "io-stage"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "10s"
script = "fabro-io stage"

# The marker carries `run=<run_id>` (C6), and a command node cannot see the run id:
# `FABRO_RUN_ID` and the hook context are set for hooks only (invariants-graph, *Agents and
# hooks*). A `stage_start` hook can, so this one writes it to a file for `post`. Non-blocking
# and always exit 0: a hook that cannot write the file costs the marker's `run=` field and
# nothing else, and `post` reads an absent file as `run=unknown`.
[[run.hooks]]
id = "orientation-run-id"
event = "stage_start"
matcher = "^agent$"
blocking = false
sandbox = true
timeout = "10s"
script = "mkdir -p /tmp/fabro/orientation; printf '%s' \"$FABRO_RUN_ID\" > /tmp/fabro/orientation/run_id 2>/dev/null || true; exit 0"

# git-guard (docs/coder-tweaks C2): blocks mutating git from an agent's `shell`. Required by
# R11 wherever the `io` server is declared. Any exit but 2 blocks, so the wrapper turns a
# missing binary (exit 127) into 0. The map reads the checkout and changes nothing.
[[run.hooks]]
id = "git-guard"
event = "pre_tool_use"
matcher = "^shell$"
blocking = true
sandbox = true
timeout = "5s"
script = "fabro-io git-guard; [ $? -eq 2 ] && exit 2; exit 0"

# box-guard (more-local-inference C10, D17 layer 3): before each agent stage, look at the
# box's coder loop. If it is in a box stage, or strix-infer is busy, cancel this run's own
# run and let the stage die with it. The job is queued again and starts later: a cancel before
# `post` leaves nothing on GitHub (D9).
[[run.hooks]]
id = "box-guard"
event = "stage_start"
matcher = "^agent$"
blocking = true
sandbox = true
timeout = "30s"
script = "fabro-io box-guard; [ $? -eq 2 ] && exit 2; exit 0"
